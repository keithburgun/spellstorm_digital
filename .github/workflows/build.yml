name: Build Spellstorm

# Builds the Android APK and the Windows .exe side by side, then publishes both
# as a GitHub Release. Runs on every change to main (except README edits),
# or by hand from Actions → Build Spellstorm → Run workflow.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-spellstorm
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm ci
      - name: Create the Android project and apply Spellstorm branding
        run: |
          npx cap add android
          cp -r branding/res/. android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx cap sync android
      - name: Use the project's signing key (so new builds install over old ones)
        run: |
          mkdir -p ~/.android
          cp branding/debug.keystore ~/.android/debug.keystore
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Spellstorm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Spellstorm-APK
          path: Spellstorm.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the game into the desktop app
        run: |
          mkdir -p desktop/app
          cp www/index.html desktop/app/index.html
      - name: Install packages
        working-directory: desktop
        run: |
          npm ci
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Build Spellstorm.exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Spellstorm-Windows
          path: desktop/dist/Spellstorm.exe

  release:
    name: Publish release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "v1.0.${{ github.run_number }}" out/Spellstorm.apk out/Spellstorm.exe \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Spellstorm 1.0.${{ github.run_number }}" \
            --notes "Built from commit ${{ github.sha }}. Download **Spellstorm.apk** for Android or **Spellstorm.exe** for Windows."
