name: Build Spellstorm

# Builds the Android APK, the Windows .exe and the Linux AppImage (Steam Deck) side by side, publishes them as a
# GitHub Release, and uploads them and the browser version to itch.io. Runs on every change to main (except README edits),
# or by hand from Actions → Build Spellstorm → Run workflow. A hand-started run on another branch only builds (no release, no upload).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'source/**', '.gitignore', '.github/scripts/**', '.github/workflows/itch.yml']
  workflow_dispatch:

concurrency:
  group: build-spellstorm
  cancel-in-progress: true

permissions:
  contents: write   # the build jobs upload their files straight to the (draft) release

env:
  VERSION: 1.0.${{ github.run_number }}
  TAG: v1.0.${{ github.run_number }}
  GH_TOKEN: ${{ github.token }}
  MAIN: ${{ github.ref == 'refs/heads/main' }}

# Files go straight into a draft GitHub release (no Actions "artifacts", which have a storage quota);
# when all three apps are in, the release is published and the same files go to itch.io.
jobs:
  start:
    name: Start the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create a draft release
        run: |
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --draft \
            --title "Spellstorm $VERSION" \
            --notes "Built from commit ${{ github.sha }}. Download **Spellstorm-$VERSION.apk** for Android, **Spellstorm-$VERSION.exe** for Windows, or **Spellstorm-$VERSION.AppImage** for Linux and Steam Deck."

  android:
    name: Android APK
    needs: [start]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm ci
      - name: Create the Android project and apply Spellstorm branding
        run: |
          npx cap add android
          cp -r branding/res/. android/app/src/main/res/
          # controller support: our MainActivity forwards game-controller input to the game
          test -f android/app/src/main/java/com/spellstorm/game/MainActivity.java
          cp branding/java/MainActivity.java android/app/src/main/java/com/spellstorm/game/MainActivity.java
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx cap sync android
      - name: Use the project's signing key (so new builds install over old ones)
        run: |
          mkdir -p ~/.android
          cp branding/debug.keystore ~/.android/debug.keystore
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Spellstorm-1.0.${{ github.run_number }}.apk
      - name: Add it to the release
        if: env.MAIN == 'true'
        run: gh release upload "$TAG" "Spellstorm-$VERSION.apk" --repo "${{ github.repository }}" --clobber

  windows:
    name: Windows EXE
    needs: [start]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the game into the desktop app
        run: |
          mkdir -p desktop/app
          cp www/index.html desktop/app/index.html
      - name: Install packages
        working-directory: desktop
        run: |
          npm ci
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Build Spellstorm.exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable --x64 --publish never
      - name: Add it to the release
        if: env.MAIN == 'true'
        run: gh release upload "$TAG" "desktop/dist/Spellstorm-$VERSION.exe" --repo "${{ github.repository }}" --clobber

  linux:
    name: Linux AppImage (Steam Deck)
    needs: [start]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the game into the desktop app
        run: |
          mkdir -p desktop/app
          cp www/index.html desktop/app/index.html
      - name: Install packages
        working-directory: desktop
        run: |
          npm ci
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Build Spellstorm.AppImage
        working-directory: desktop
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Add it to the release
        if: env.MAIN == 'true'
        run: gh release upload "$TAG" "desktop/dist/Spellstorm-$VERSION.AppImage" --repo "${{ github.repository }}" --clobber

  release:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest

  itch:
    name: Upload to itch.io
    if: github.ref == 'refs/heads/main'
    needs: [release]
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}   # itch.io API key (repo secret)
      ITCH_GAME: ${{ vars.ITCH_GAME }}                # e.g. keithburgun/spellstorm (repo variable)
    steps:
      - name: Check the itch.io settings
        id: cfg
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::warning::itch.io upload skipped: add the BUTLER_API_KEY secret and the ITCH_GAME variable in the repo settings."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.go == 'yes'
      - name: Download the release's apps
        if: steps.cfg.outputs.go == 'yes'
        run: gh release download "$TAG" --repo "${{ github.repository }}" --dir out --pattern 'Spellstorm-*'
      - name: Build the browser version from the same source as the apps
        if: steps.cfg.outputs.go == 'yes'
        run: |
          cp www/index.html /tmp/www-committed.html
          SPELLSTORM_VERSION="$VERSION" python3 source/build.py
          # The apps were built from www/index.html; only upload a browser version made from that same source.
          if cmp -s www/index.html /tmp/www-committed.html; then echo "html=yes" >> "$GITHUB_ENV"
          else echo "::warning::source/ doesn't match www/index.html (rebuild before releasing). Skipping the browser upload so all three stay in step."; echo "html=no" >> "$GITHUB_ENV"; fi
      - name: Upload Android, Windows, Linux and browser builds
        if: steps.cfg.outputs.go == 'yes'
        run: |
          HTML=""; if [ "$html" = yes ]; then HTML=source/dist/spellstorm-web-online.zip; fi
          bash .github/scripts/itch_upload.sh "out/Spellstorm-$VERSION.apk" "out/Spellstorm-$VERSION.exe" "$HTML" "$VERSION" "out/Spellstorm-$VERSION.AppImage"
