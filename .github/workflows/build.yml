name: Build Spellstorm

# Builds the Android APK and the Windows .exe side by side, publishes both as a
# GitHub Release, and uploads Android, Windows and the browser version to itch.io. Runs on every change to main (except README edits),
# or by hand from Actions → Build Spellstorm → Run workflow.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'source/**', '.gitignore', '.github/scripts/**', '.github/workflows/itch.yml']
  workflow_dispatch:

concurrency:
  group: build-spellstorm
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm ci
      - name: Create the Android project and apply Spellstorm branding
        run: |
          npx cap add android
          cp -r branding/res/. android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx cap sync android
      - name: Use the project's signing key (so new builds install over old ones)
        run: |
          mkdir -p ~/.android
          cp branding/debug.keystore ~/.android/debug.keystore
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Spellstorm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Spellstorm-APK
          path: Spellstorm.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the game into the desktop app
        run: |
          mkdir -p desktop/app
          cp www/index.html desktop/app/index.html
      - name: Install packages
        working-directory: desktop
        run: |
          npm ci
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Build Spellstorm.exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Spellstorm-Windows
          path: desktop/dist/Spellstorm.exe

  release:
    name: Publish release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "v1.0.${{ github.run_number }}" out/Spellstorm.apk out/Spellstorm.exe \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Spellstorm 1.0.${{ github.run_number }}" \
            --notes "Built from commit ${{ github.sha }}. Download **Spellstorm.apk** for Android or **Spellstorm.exe** for Windows."

  itch:
    name: Upload to itch.io
    needs: [android, windows]
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}   # itch.io API key (repo secret)
      ITCH_GAME: ${{ vars.ITCH_GAME }}                # e.g. keithburgun/spellstorm (repo variable)
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Check the itch.io settings
        id: cfg
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::warning::itch.io upload skipped: add the BUTLER_API_KEY secret and the ITCH_GAME variable in the repo settings."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.go == 'yes'
      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.go == 'yes'
        with:
          path: out
          merge-multiple: true
      - name: Build the browser version from the same source as the apps
        if: steps.cfg.outputs.go == 'yes'
        run: |
          cp www/index.html /tmp/www-committed.html
          python3 source/build.py
          # The apps were built from www/index.html; only upload a browser version made from that same source.
          if cmp -s www/index.html /tmp/www-committed.html; then echo "html=yes" >> "$GITHUB_ENV"
          else echo "::warning::source/ doesn't match www/index.html (rebuild before releasing). Skipping the browser upload so all three stay in step."; echo "html=no" >> "$GITHUB_ENV"; fi
      - name: Upload Android, Windows and browser builds
        if: steps.cfg.outputs.go == 'yes'
        run: |
          HTML=""; if [ "$html" = yes ]; then HTML=source/dist/spellstorm-web-online.zip; fi
          bash .github/scripts/itch_upload.sh out/Spellstorm.apk out/Spellstorm.exe "$HTML" "$VERSION"
