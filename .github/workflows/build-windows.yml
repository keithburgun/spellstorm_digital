name: Build Spellstorm for Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy the game into the desktop app
        run: |
          mkdir -p desktop/app
          cp www/index.html desktop/app/index.html

      - name: Install packages
        working-directory: desktop
        run: npm ci

      - name: Build Spellstorm.exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Spellstorm-Windows
          path: desktop/dist/Spellstorm.exe
