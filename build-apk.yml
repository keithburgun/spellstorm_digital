name: Build Spellstorm APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Create the Android project and apply Spellstorm branding
        run: |
          npx cap add android
          cp -r branding/res/. android/app/src/main/res/
          npx cap sync android

      - name: Use the project's signing key (so new builds install over old ones)
        run: |
          mkdir -p ~/.android
          cp branding/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Spellstorm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Spellstorm-APK
          path: Spellstorm.apk
