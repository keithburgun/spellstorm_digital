<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spellstorm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>/*CORPORATA*/</style>
<style>
:root{
  --startbg:#ffffff; --sceneop:.13;
  --shop:#f3e5c4; --shop2:#f8d9a0;
  --bg:#e7e1f1; --bg2:#d5eceb; --panel:#f6f2fc; --panel2:#ebe4f7; --ink:#1d1735; --muted:#5d5580; --line:#c3b7dd;
  --bolt:#d9a300; --fire:#d4452a; --water:#2585bd; --earth:#a97a1c; --mana:#9b39b3; --hp:#c3243f; --shard:#d02f6c; --accent:#6b4fa3;
  --shadow:0 2px 8px rgba(40,20,80,.22);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --startbg:#15112a; --sceneop:.22;
  --shop:#2a1c0c; --shop2:#5a3a12;
  --bg:#15112a; --bg2:#12303a; --panel:#221b3e; --panel2:#2c2450; --ink:#f1ecff; --muted:#a99fcb; --line:#3f3569;
  --bolt:#f4cf3a; --fire:#f0643f; --water:#45b1e8; --earth:#dfa93e; --mana:#cf6ae6; --hp:#ff5a77; --shard:#ff5e9a; --accent:#a58be0;
  --shadow:0 2px 10px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --startbg:#15112a; --sceneop:.22;
  --shop:#2a1c0c; --shop2:#5a3a12;
  --bg:#15112a; --bg2:#12303a; --panel:#221b3e; --panel2:#2c2450; --ink:#f1ecff; --muted:#a99fcb; --line:#3f3569;
  --bolt:#f4cf3a; --fire:#f0643f; --water:#45b1e8; --earth:#dfa93e; --mana:#cf6ae6; --hp:#ff5a77; --shard:#ff5e9a; --accent:#a58be0;
  --shadow:0 2px 10px rgba(0,0,0,.5);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(120% 70% at 70% 0%,var(--bg2),transparent 60%),var(--bg);color:var(--ink);
  font:15px/1.4 'Corporata','Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;position:fixed;inset:0;touch-action:manipulation}
button{font:inherit;color:inherit}
b,strong,th{font-weight:700}  /* bold always means Corporata Bold */
h1,h2,.disp{font-family:'Corporata','Arial Rounded MT Bold','Trebuchet MS',sans-serif;font-weight:700;letter-spacing:.01em}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:.55em 1.1em;cursor:pointer;font-weight:700;box-shadow:var(--shadow)}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.card:focus-visible,.chip:focus-visible{outline:3px solid var(--bolt);outline-offset:2px}

/* ---------- layout ---------- */
#app{height:100%;overflow:hidden;display:grid;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto auto;
  grid-template-areas:"opp" "cloud" "arena" "prompt" "me" "hand";
  --cw:min(17vw,11vh);--cw:min(17vw,11svh);}
@media (orientation:landscape) and (min-width:720px){
  #app{grid-template-columns:auto minmax(0,1fr) minmax(210px,23vw);grid-template-rows:auto minmax(calc(var(--cw)*1.4 + 34px),1fr) auto auto auto;
    grid-template-areas:"opp opp log" "cloud arena log" "prompt prompt log" "me me log" "hand hand log";--cw:min(7.6vw,15.5vh);--cw:min(7.6vw,15.5svh);gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  #tick{display:none!important}
  #logwrap{display:flex!important}
}
#opp{grid-area:opp}#me{grid-area:me}#cloud{grid-area:cloud}#arena{grid-area:arena}#hand{grid-area:hand}#prompt{grid-area:prompt}#logwrap{grid-area:log}

/* ---------- cards ---------- */
.card{width:var(--cw);aspect-ratio:750/1050;border-radius:calc(var(--cw)*.025);background:#2b2248 center/cover no-repeat;border:0;padding:0;
  box-shadow:var(--shadow);cursor:pointer;flex:none;position:relative;transition:transform .15s}
.card.back{border:1px solid rgba(255,255,255,.25)}
.card.can{outline:3px solid var(--bolt);outline-offset:2px}
.card.dead{filter:grayscale(.7) brightness(.75)}
.card.mini{--cw:calc(var(--w,1)*1px)}
.wcard{height:calc(var(--cw)*1.4);aspect-ratio:1050/750;border-radius:calc(var(--cw)*.055);background:#1f4a4c center/cover;border:0;box-shadow:var(--shadow);cursor:pointer;padding:0;flex:none}
.slot{width:var(--cw);aspect-ratio:750/1050;border:2px dashed var(--line);border-radius:calc(var(--cw)*.055);display:grid;place-items:center;color:var(--muted);font-size:.75rem;text-align:center;padding:4px;flex:none}

/* ---------- panels ---------- */
.pp{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;box-shadow:var(--shadow);min-width:0}
.por{width:48px;height:48px;border-radius:50%;background-size:260%;background-position:52% 24%;flex:none;border:2px solid var(--line);cursor:pointer;padding:0}
.pinfo{min-width:0;flex:1}
.pname{font-family:'Corporata',sans-serif;font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pname .tag{font-family:'Corporata','Atkinson Hyperlegible',sans-serif;font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.initb{display:inline-flex;align-items:center;gap:3px;background:var(--bolt);color:#2a1d00;border-radius:999px;padding:0 7px 0 4px;font-size:.72rem;font-family:'Corporata','Atkinson Hyperlegible',sans-serif;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-weight:700;font-size:.92rem}
.stat{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.stat small{font-weight:400;color:var(--muted)}
.stat svg{width:17px;height:17px;flex:none}
.pips{display:inline-flex;gap:2px}
.pip{width:7px;height:7px;border-radius:2px;background:var(--line)}
.pip.on{background:var(--earth)}
.shpips .pip{transform:rotate(45deg);width:6px;height:6px}
.shpips .pip.on{background:var(--shard)}
.piles{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;align-items:center}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:.75rem;padding:1px 7px;cursor:pointer}
.backs{display:flex;gap:0}
.backs .card{--cw:20px;margin-left:-8px;box-shadow:none;cursor:default}
.backs .card:first-child{margin-left:0}
.hit{animation:hit .45s}
@keyframes hit{0%{background:color-mix(in srgb,var(--hp) 35%,var(--panel))}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.ultglow{box-shadow:0 0 0 2px var(--mana),0 0 22px var(--mana)}
.tools{display:flex;gap:6px;margin-left:auto;flex:none}
.tools .chip{font-size:.8rem;padding:3px 9px}

/* ---------- cloud ---------- */
#cloud{display:flex;flex-direction:column;gap:5px;min-width:0}
.crow{display:flex;gap:5px;justify-content:center}
.crow .card{--cw:min(17.5vw,11vh);--cw:min(17.5vw,11svh)}
@media (orientation:landscape) and (min-width:720px){.crow .card{--cw:min(7.6vw,15.5vh);--cw:min(7.6vw,15.5svh)}}
.card.elig{outline:3px solid var(--bolt);outline-offset:2px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{outline-color:transparent}}
.card.inel{filter:brightness(.55) saturate(.6)}
.cfoot{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;font-size:.75rem}
.lbl{font-size:.72rem;color:var(--muted);text-align:center}
.drag{display:inline-flex;align-items:center;gap:4px}
.drag .card{--cw:18px;box-shadow:none}

/* ---------- arena ---------- */
#arena{display:flex;gap:12px;align-items:center;justify-content:center;min-height:0;min-width:0}
.wx{display:flex;flex-direction:column;gap:4px;align-items:center;max-width:calc(var(--cw)*2.1)}
.wx .cap{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.25}
.rnd{font-family:'Corporata',sans-serif;font-weight:700;font-size:1rem}
.duel{display:flex;gap:10px;align-items:center}
.side{display:flex;flex-direction:column;align-items:center;gap:3px}
.flip{animation:flip .55s ease-out}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg)}100%{transform:none}}
.won{box-shadow:0 0 0 3px var(--elc),0 0 26px var(--elc)}
.resolving{outline:3px solid var(--accent);outline-offset:3px}
.vs{font-family:'Corporata',sans-serif;font-weight:700;color:var(--muted);font-size:.9rem}
.wheel{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.3}

/* ---------- hand + prompt ---------- */
#hand{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 4px 4px;justify-content:safe center;min-height:calc(var(--cw)*1.2*1.4 + 12px)}
#hand .card{--cw:calc(min(17vw,11vh)*1.2);--cw:calc(min(17vw,11svh)*1.2)}
@media (orientation:landscape) and (min-width:720px){#hand .card{--cw:calc(min(7.4vw,14.5vh)*1.12);--cw:calc(min(7.4vw,14.5svh)*1.12)}}
@media (hover:hover){#hand .card:hover{transform:translateY(-6px)}}
#prompt{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-height:44px}
#prompt .q{flex:1 1 240px;font-weight:700}
#prompt .q small{display:block;font-weight:400;color:var(--muted)}
#prompt.waiting .q{font-weight:400;color:var(--muted)}
#prompt.ask{border-color:var(--bolt);box-shadow:0 0 0 1px var(--bolt)}
#tick{grid-area:auto;display:none}

/* ---------- log ---------- */
#logwrap{display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0;box-shadow:var(--shadow)}
#logwrap h2{margin:0;padding:8px 12px 4px;font-size:1rem}
.log{list-style:none;margin:0;padding:4px 12px 10px;overflow-y:auto;font-size:.82rem;flex:1;min-height:0}
.log li{padding:2px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.log .head{font-weight:700;color:var(--accent);padding-top:8px}
.log .dmg{color:var(--hp)}.log .heal{color:var(--water)}.log .shard{color:var(--shard);font-weight:700}.log .big{font-weight:700}
.log .counter{color:var(--earth);font-weight:700}.log .ini{color:var(--muted)}.log .junk{color:var(--muted)}.log .warn{color:var(--hp)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(10,6,25,.62);display:none;align-items:center;justify-content:center;z-index:40;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.ov.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:min(94vw,760px);max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.sheet h2{margin:0 0 8px;font-size:1.3rem}
.bigcard{width:min(84vw,56vh*0.714,420px);aspect-ratio:750/1050;border-radius:16px;background:center/contain no-repeat;margin:0 auto}
.bigw{width:min(88vw,70vh*1.4,620px);aspect-ratio:1050/750;border-radius:16px;background:center/contain no-repeat;margin:0 auto}
.bigwiz{width:min(84vw,62vh*0.652,440px);aspect-ratio:560/859;border-radius:16px;background:center/contain no-repeat;margin:0 auto}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.grid .card{--cw:min(26vw,120px)}
.tc{display:flex;flex-direction:column;align-items:center;gap:3px}
.tc .card.picked{outline:3px solid var(--bolt);outline-offset:2px;box-shadow:0 0 16px 4px color-mix(in srgb,var(--bolt) 70%,transparent)}
.tc .own{font-size:.7rem;color:var(--muted)}
.tc .zoom{font-size:.72rem;background:none;border:1px solid var(--line);border-radius:6px;padding:0 6px;cursor:pointer;color:var(--muted)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 30%);transform:translate(-50%,-50%) scale(.9);background:var(--panel);border:2px solid var(--bolt);
  border-radius:16px;padding:12px 20px;font-family:'Corporata',sans-serif;font-weight:700;font-size:1.35rem;z-index:45;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center;max-width:86vw;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- start ---------- */
#start{background:radial-gradient(90% 60% at 50% 0%,var(--bg2),transparent 70%),var(--bg);position:fixed;inset:0;z-index:25;overflow:auto;display:flex;flex-direction:column;align-items:center;
  padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
#start h1.oldtitle{font-size:clamp(3rem,13vw,6.5rem);line-height:.9;margin:.2em 0 .1em;text-align:center;
  background:linear-gradient(180deg,var(--bolt) 0%,var(--mana) 55%,var(--water) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
#start .sub{color:var(--muted);text-align:center;max-width:36em;margin:0 0 20px}
.picks{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;width:min(88vw,300px);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.pick .art{width:100%;aspect-ratio:1;border-radius:12px;background-size:118%;background-position:50% 21%;border:0;cursor:zoom-in}
.pick h2{margin:0;font-size:1.5rem}
.pick p{margin:0;font-size:.88rem;color:var(--muted)}
.pick .btn{align-self:stretch}
.fine{font-size:.8rem;color:var(--muted);margin-top:18px;text-align:center;max-width:40em}
.rules p{margin:.4em 0;max-width:60ch}
.rules h3{font-family:'Corporata',sans-serif;font-weight:700;font-weight:400;margin:.8em 0 .2em}
.pn{display:none}
@media (max-width:560px){.pips{display:none}.pn{display:inline}.stats{gap:2px 10px;font-size:.88rem}.pp{padding:5px 8px;gap:8px}.por{width:40px;height:40px}.piles{margin-top:2px}}
.goals{display:flex;gap:14px;align-items:center;flex:none;font-family:'Corporata',sans-serif;font-weight:700;line-height:1}
.goal{display:inline-flex;align-items:center;gap:4px;font-size:1.7rem}
.goal svg{width:26px;height:26px}.goal small{font-family:'Corporata','Atkinson Hyperlegible',sans-serif;font-size:.8rem;color:var(--muted);align-self:flex-end;margin-bottom:3px}
.rnd.last{color:var(--fire);animation:bob 1.8s ease-in-out infinite;text-align:center}
.rnd small{display:block;font-family:'Corporata','Atkinson Hyperlegible',sans-serif;font-weight:700;font-size:.75rem}
@keyframes bob{50%{transform:translateY(-3px)}}
body{transition:background-color .6s}
body.shop{background:radial-gradient(120% 70% at 30% 0%,var(--shop2),transparent 60%),var(--shop)}
@media (orientation:landscape) and (min-width:720px){.logbtn{display:none}}
body.phoneview{background:#0c0918}
body.shop #app.phone{background:radial-gradient(120% 70% at 30% 0%,var(--shop2),transparent 60%),var(--shop)}
#arena{min-height:calc(var(--cw)*1.45)}
#app.phone{width:390px;height:min(844px,100%);margin:0 auto;border-radius:18px;background:var(--bg);transition:background-color .6s;outline:2px solid #6b56a8;
  grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto auto minmax(0,1fr) auto auto auto!important;grid-template-areas:"opp" "cloud" "arena" "prompt" "me" "hand"!important;--cw:66px!important;gap:6px!important;padding:6px!important}
#app.phone #logwrap{display:none!important}#app.phone .logbtn{display:inline-block!important}
#app.phone .crow .card{--cw:66px}#app.phone #hand .card{--cw:80px}#app.phone .pips{display:none}#app.phone .pn{display:inline}
#app.phone .stats{font-size:.85rem;gap:2px 10px}#app.phone .por{width:40px;height:40px}#app.phone .goal{font-size:1.4rem}#app.phone .goal svg{width:21px;height:21px}
@media (max-width:560px){.goal{font-size:1.4rem}.goal svg{width:21px;height:21px}.goals{gap:10px}}
/* start screen */
.sel{display:flex;flex-direction:column;gap:14px;width:min(94vw,760px)}
.row h2{margin:0 0 6px;font-size:1.2rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row h2 label{font-family:'Corporata','Atkinson Hyperlegible',sans-serif;font-size:.9rem;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.row h2 input{width:18px;height:18px;accent-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 10px 6px 6px;cursor:pointer;text-align:left}
.tile .por{width:42px;height:42px;pointer-events:none}
.tile b{display:block;font-family:'Corporata',sans-serif;font-weight:700;font-weight:400;font-size:1rem}
.tile span{font-size:.72rem;color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--bolt);box-shadow:0 0 0 2px var(--bolt)}
.tile:disabled{opacity:.4;cursor:not-allowed}
.rows.rand .tiles{opacity:.45;pointer-events:none}
.info{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.88rem;min-height:4em}
.info p{margin:.2em 0}
.tk{display:inline-block;width:19px;height:19px;background:center/contain no-repeat;flex:none;vertical-align:middle}
.goal .tk{width:30px;height:30px}.initb .tk{width:15px;height:15px}
@media (max-width:560px){.goal .tk{width:24px;height:24px}}
#app.phone .goal .tk{width:24px;height:24px}
.xtra{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-weight:700;font-size:.88rem;margin-top:2px}
.tokrow{display:inline-flex;gap:1px;align-items:center}.tokrow .tk{width:17px;height:17px}.tokrow .tk.off{opacity:.22;filter:grayscale(1)}
.potion{height:calc(var(--cw)*1.4);aspect-ratio:420/608;border-radius:10px;background:center/cover;box-shadow:0 0 0 3px var(--mana),var(--shadow);animation:flip .5s ease-out}
.jl{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jl li{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.85rem;display:flex;gap:6px;align-items:center}
.jl li.on{border-color:var(--bolt);background:color-mix(in srgb,var(--bolt) 18%,transparent);font-weight:700}
#title{position:fixed;inset:0;z-index:27;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:#120b20;overflow:hidden;
  padding:0 16px max(6vh,calc(env(safe-area-inset-bottom,0px) + 20px))}
#title .hero{position:absolute;inset:0;background-size:cover;background-position:center 16%}
@media (orientation:landscape){#title .hero{left:50%;right:auto;width:min(100vw,118vh);transform:translateX(-50%);background-size:cover;background-position:center 30%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}.tbtn{font-size:1.15rem;padding:.26em .8em}.tmenu{gap:6px;width:min(36vw,250px)}#title{padding-bottom:max(3vh,calc(env(safe-area-inset-bottom,0px) + 10px))}#title .fine{margin-top:6px}}
@media (orientation:portrait){#title .hero{background-size:122vw auto;background-position:center top;background-repeat:no-repeat}
  #title .hero::after{background:linear-gradient(180deg,transparent 30%,rgba(14,8,28,.7) 48%,#120b20 60%)}}
#title .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,rgba(14,8,28,.55) 62%,rgba(14,8,28,.92) 100%)}
.tmenu{position:relative;display:flex;flex-direction:column;gap:10px;width:min(78vw,320px);animation:rise .7s ease-out both .15s}

<script>
const IMG = /*IMGS*/;
(function(){let c='';for(const k in IMG)c+=k.endsWith('_2e')?`body.ed2 .ci-${k.slice(0,-3)}{background-image:url(${IMG[k]})}`:`.ci-${k}{background-image:url(${IMG[k]})}`;const s=document.createElement('style');s.textContent=c;document.head.appendChild(s);})();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Update a section in place instead of rebuilding it: elements are matched by card identity (data-u) or position,

const keyOf=n=>n.nodeType===1?(n.getAttribute('data-u')||n.getAttribute('data-key')):null;
function morph(el,html){const tp=document.createElement('template');tp.innerHTML=html;syncKids(el,tp.content);}
function syncKids(dst,src){
  const byKey=new Map();for(const n of dst.childNodes){const k=keyOf(n);if(k)byKey.set(k,n);}
  let i=0;for(const nn of [...src.childNodes]){const k=keyOf(nn);let use=null;

const ELT={F:'▲ FIRE',W:'● WATER',E:'■ EARTH'};

function panel(p){
  const P=S.pl[p],W=WIZ[P.wiz];

  <div class="pinfo"><div class="pname" data-k="init">${name}</div>
  <div class="stats">
   <span data-k="mana" class="stat smana${an('mana')}" title="Mana ${P.mana}. ${esc(W.un)} costs ${W.cost} mana."><span class="sico">${IC.mana}<b class="cost">${W.cost}</b></span><b class="num">${P.mana}</b></span>
   <span data-k="power" class="stat spow${an('power')}" title="Tier ${ROM[P.tier]} · Power ${P.power} — reaching 7 raises your Tier"><i class="tierb ci-tier${Math.max(1,Math.min(3,P.tier))}" role="img" aria-label="Tier ${ROM[P.tier]}"></i><b class="num">${P.power}</b><small class="pn">/7</small></span>
  </div>

}
function fitHearts(){for(const g of document.querySelectorAll('#me .goals,#opp .goals')){const row=g.querySelector('.hearts.one');if(!row)continue;const hs=[...row.children];row.style.removeProperty('--hs');hs.forEach(h=>h.style.marginLeft='');if(hs.length<2)continue;
    const bar=row.parentElement,num=bar.querySelector('b'),shard=g.querySelector('[data-k=shards]'),pp=g.closest('.pp'),pr=pp.getBoundingClientRect();
    const pad=parseFloat(getComputedStyle(pp).paddingRight)||8,right=Math.min(pr.right-pad,innerWidth-4);
    const limit=right-(shard?shard.getBoundingClientRect().width:0)-14,rl=row.getBoundingClientRect().left,numW=num?num.getBoundingClientRect().width+6:0,avail=Math.max(20,limit-rl-numW);
    let w=hs[0].getBoundingClientRect().width,n=hs.length;if(n*w<=avail)continue;
    const MAXO=.85;if(n*w-(n-1)*MAXO*w>avail){w=Math.max(5,avail/(n-(n-1)*MAXO));row.style.setProperty('--hs',w+'px');}   // overlapping alone isn't enough: shrink the hearts too

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(fitHearts));
addEventListener('resize',()=>requestAnimationFrame(fitHearts));
function hearts(P,cls=''){

const RM=()=>OPT.motion==='reduced';
let LASTV=[{},{}];

let LASTSP=null,LASTJ=null,LASTVOID=null;
function junkCounts(){return S.pl.map(P=>{const o={ice:0,ash:0,curse:0};for(const c of [...P.hand,...P.deck,...P.discard])if(o[c.id]!==undefined)o[c.id]++;return o;});}
function trackBumps(){const n=performance.now();if(S&&S.void){const v=S.void.length;if(LASTVOID!=null&&v>LASTVOID)SFX.seq('void',Math.min(3,v-LASTVOID),220);LASTVOID=v;}if(S&&S.special){const sp=S.special,J=junkCounts();

      if(!(RPLAY&&RPLAY.ff)&&!RM()){const chip=[...document.querySelectorAll('#cloud .cfoot .chip')].find(e=>e.textContent.trim().toUpperCase().startsWith(k.toUpperCase())),cr=chip&&chip.getBoundingClientRect();

    LASTSP={ice:sp.ice,ash:sp.ash,curse:sp.curse};LASTJ=J;}for(const p of S.pl.keys()){LASTV[p]=LASTV[p]||{};const P=S.pl[p];const v={hp:P.hp,mana:P.mana,power:P.tier*10+P.power,shards:P.shards,doom:P.doom,energy:P.energy,hand:P.hand.length};

  if(S.blast){const k=S.blast.ts[0]+S.blast.ts[1];if(k!==LASTBT){if(LASTBT!==null)SFX.play('tick');LASTBT=k;}if(S.blast.stage==='result'&&!BRES){BRES=1;SFX.seq('shard',S.blast.winner>=0?2:1,170);}}else{LASTBT=null;BRES=0;}

let LASTINIT=null;

    if(!a)continue;const r=a.getBoundingClientRect();const key=f.p+':'+(a.dataset.k||'junk');const i=used[key]=(used[key]||0)+1;
    const el=document.createElement('div');el.className='flt f-'+f.k;el.textContent=f.t;el.style.left=(r.left+r.width/2)+'px';el.style.top=(r.top-4-(i-1)*20)+'px';
    el.style.animationDuration=(1.5*Math.max(speed,.5))+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),1600*Math.max(speed,.5));}}
function bump(p,k){return on('b_'+k+p)?(FX['d_'+k+p]<0?' shk':' pop'):'';}
function fitPrompt(){const el=$('#prompt');if(!el)return;const kids=[...el.querySelectorAll('.q,.q small,.btn,.lbl')];
  kids.forEach(k=>k.style.fontSize='');if(el.scrollHeight<=el.clientHeight+1&&el.scrollWidth<=el.clientWidth+1)return;
  const base=kids.map(k=>parseFloat(getComputedStyle(k).fontSize));let s=1;
  while((el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)&&s>0.55){s-=0.05;kids.forEach((k,i)=>k.style.fontSize=(base[i]*s).toFixed(1)+'px');}}

// Shrink a row/stack to fit its area. Measures LAYOUT size (offsetWidth/offsetHeight), which ignores transforms,

const ITIP={power:'Power +1: gain 1 Power. Reaching 7 Power raises your Tier.',mana:'Mana +1: gain 1 mana. Mana pays for your wizard’s Ultimate.',
  gain:'Gain a card: take a card from the Storm Cloud at or below your Tier.',draw:'Draw a card.',
  ult:'Ultimate: after this card resolves, you may use your wizard’s Ultimate if you have enough mana.',
  disc:'Discard effect: happens when this card is discarded from your hand, including at the Blast.',
  init:'Initiative: the player with the Initiative resolves their card first.',
  fire:'Fire. Fire beats Earth; Water beats Fire.',water:'Water. Water beats Fire; Earth beats Water.',earth:'Earth. Earth beats Water; Fire beats Earth.',
  wiz:'This is a starting card for this Wizard. This card can not be VOIDed.',
  t1:'Tier I card: you can gain it from the Storm Cloud at any Tier.',t2:'Tier II card: you can gain it once you reach Tier II.',t3:'Tier III card: you can gain it once you reach Tier III.',t4:'Tier IV: a Dragon.'};
const ELK={F:'fire',W:'water',E:'earth'};
function ispot(x,y,w,h,tip){return `<button type="button" tabindex="-1" class="ispot${y<22?' below':''}${x>70?' left':x<20?' right':''}" data-a="ispot" data-tip="${esc(tip)}" aria-label="${esc(tip)}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></button>`;}
function iconSpots(id){const d=CARDS[id];if(!d)return '';const sid=curEd()===2&&ICONDATA.spots[id+'_2e']?id+'_2e':id;const out=(ICONDATA.spots[sid]||[]).map(([x,y,w,h,k])=>ispot(x,y,w,h,ITIP[k]));
  if(ELK[d.el])out.push(ispot(6.2,4.4,10.6,7.8,'This card’s element: '+ITIP[ELK[d.el]]));
  if(d.disc)out.push(ispot(81,4.2,11.8,8.6,'This card has a discard effect. '+ITIP.disc.replace('Discard effect: ','It ')));
  if(d.wiz)out.push(ispot(83.6,87.8,14.8,10.6,ITIP.wiz));else if(d.t>=1&&d.t<=4&&!['pgem','dart','block'].includes(id))out.push(ispot(83.6,87.8,14.8,10.6,ITIP['t'+d.t]));   // basic cards print no Tier badge
  return out.join('');}
function iconKeyHTML(){const P=ICONDATA.pics,row=(pic,name,txt)=>`<div class="ikrow"><span class="ikpic">${pic}</span><div><b>${name}</b><span>${esc(txt)}</span></div></div>`,img=k=>`<img src="${P[k]}" alt="">`;
  return `<h3>Icon Key</h3><div class="ikgrid">${[
    row(img('power'),'Power +1',ITIP.power.replace(/^Power \+1: /,'')),row(img('mana'),'Mana +1',ITIP.mana.replace(/^Mana \+1: /,'')),
    row(img('gain'),'Gain a card',ITIP.gain.replace(/^Gain a card: /,'')),row(img('draw'),'Draw a card','Draw the top card of your deck.'),
    row(img('ult'),'Ultimate',ITIP.ult.replace(/^Ultimate: /,'')),row(img('disc'),'Discard effect',ITIP.disc.replace(/^Discard effect: /,'')),
    row(img('init'),'Initiative',ITIP.init.replace(/^Initiative: /,'')),
    row(img('fire'),'Fire','Fire beats Earth. Water beats Fire.'),row(img('water'),'Water','Water beats Fire. Earth beats Water.'),row(img('earth'),'Earth','Earth beats Water. Fire beats Earth.'),
    row('<i class="tierb ci-tier1"></i>','Tier badge','The card’s Tier. You can gain it from the Storm Cloud once you reach that Tier. Basic cards have no badge.'),
    row(P.wiz?img('wiz'):'','Wizard card',ITIP.wiz)].join('')}</div><p class="lbl">The icon in a card’s top-left corner is its element. Hover or tap any icon on a zoomed card to see what it means.</p>`;}
function iconLegend(id){const d=CARDS[id];if(!d)return '';const ts=[...(ICONDATA.leg[id]||[])];if(d.ult&&!ts.includes('ult'))ts.push('ult');if(d.disc&&!ts.includes('disc'))ts.push('disc');
  return ts.length?`<div class="ileg" aria-label="Icons on this card">${ts.filter(k=>ICONDATA.pics[k]).map(k=>`<span class="ilegi"><img src="${ICONDATA.pics[k]}" alt=""><span>${esc(ITIP[k])}</span></span>`).join('')}</div>`:'';}
function preview(c,acts=''){acts=`<button class="btn alt" data-a="ikey">Icon Key</button>`+acts;
  const d=CARDS[c.id];const tierNote=d.t&&d.t<=3?`Tier ${ROM[d.t]}`:(d.t===4?'Tier IV Dragon':'Special card');
  openOv(`<div class="bigcard ci-${c.id}" role="img" aria-label="${esc(d.n)}">${iconSpots(c.id)}</div><div class="ikey">${iconKeyHTML()}</div><div class="lbl" style="margin-top:6px">${esc(d.n)}, ${ELN[d.el]}, ${tierNote}${d.disc?', has a discard effect':''}</div><div class="acts">${acts}<button class="btn alt" data-a="close">Close</button></div>`);
}
function openPick(){
  const r=pending.req;const own=r.owner;
  const where=c=>{const P=S&&S.pl[0];if(!P)return '';return P.hand.some(x=>x.u===c.u)?'In your hand':P.discard.some(x=>x.u===c.u)?'In your discard':P.deck.some(x=>x.u===c.u)?'In your deck':'';};
  const items=r.items.map((c,i)=>{const lab=own?own(c):where(c);return `<div class="tc">${card(c,sel.includes(i)?'picked':'',`data-a="tog" data-i="${i}"`)}${lab?`<span class="own">${esc(lab)}</span>`:''}<button class="zoom" data-a="zoomi" data-i="${i}">Read</button></div>`;}).join('');
  const n=sel.length,ok=n>=r.min&&n<=r.max;
  const need=r.min===r.max?`Select ${r.min}.`:`Select ${r.min?r.min+' to ':'up to '}${r.max}.`;
  openOv(`<h2>${esc(r.q)}</h2><p class="lbl" style="text-align:left">${need} Selected: ${n}</p><div class="grid">${items}</div><div class="acts"><button class="btn" data-a="pickok" ${ok?'':'disabled'}>${n||r.min?'Confirm':'Confirm none'}</button></div>`);
}
function showPile(p,z){
  const P=S.pl[p];const who=p?WIZ[P.wiz].short+'’s':'Your';
  if(z==='deck'){openOv(`<h2>${who} deck</h2><p>${P.deck.length} cards, face-down. Cards in a deck stay hidden until drawn.</p><div class="acts"><button class="btn alt" data-a="close">Close</button></div>`);return;}
  showList(`${who} discard pile`,P.discard);
}
function showList(t,list){openOv(`<h2>${esc(t)}</h2>${list.length?`<div class="grid">${list.map((c,i)=>card(c,'',`data-a="zoomc" data-u="${c.u}"`)).join('')}</div>`:'<p>Empty.</p>'}<div class="acts"><button class="btn alt" data-a="close">Close</button></div>`);
  showList.cur=list;}
function wizCard(w){const W=WIZ[w];openOv(`<div class="bigwiz ci-wz_${w}" role="img" aria-label="${esc(W.n)}"></div><div class="acts"><button class="btn alt" data-a="close">Close</button></div>`);}
function rules(){openOv(`<div class="rules"><h2>How a game goes</h2>
<p>Each battle has four rounds. Every round a Weather card flips and affects both wizards, then you each play one card face-down. Cards reveal together; if your card’s element counters theirs (Fire beats Earth, Earth beats Water, Water beats Fire) you draw a card. Cards then resolve, Initiative holder first.</p>
<h3>Regroup</h3><p>After four rounds, cards with discard effects in your hand trigger, then the rest of your hand is your Blast Score. Higher score gains 2 Storm Shards; a tie gives each 1. ICE discarded here is −1 Blast Score. Then each wizard gains a Storm Cloud card at or below their Tier and draws up to 3.</p>
<h3>Resources</h3><p>Mana pays for your Ultimate, offered whenever you resolve a card with the Ultimate icon. Power fills a 6-step track; overflowing raises your Tier (I to III), and at Tier III it lets you take a Dragon.</p>
<h3>Winning</h3><p>Reach 8 Storm Shards, or bring your opponent to 0 health.</p>
<h3>Free-for-All (3–4 players)</h3><p>Everyone starts with 2 Storm Shards. Damage and “give” effects hit every opponent. You counter the next player clockwise, shown by the arrows on the table. A wizard at 0 health is eliminated and their cards go to the VOID. The last wizard standing, or the first to 8 Storm Shards, wins. In a Blast, the single highest score gains 2 Shards; tied highest scores gain 1 each.</p>
<h3>Ranked</h3><p>Play an endless stream of opponents near your rating, each with a username, an Elo and a secret playing style. Your Elo rises when you win and falls when you lose; beating a higher-rated opponent earns more. Resigning or abandoning a Ranked match counts as a loss.</p>
<h3>Long Match</h3><p>An optional setting: every wizard has 50% more health (rounded), and you need 12 Storm Shards to win instead of 8.</p>
<h3>Co-op vs Robot Boy and Two-on-Two</h3><p>You only deal damage, and give ICE, ASH and CURSE, to the other side. When you heal, you may heal an ally instead. You counter the next <i>opponent</i> clockwise, skipping allies. If anyone on a team wins, the whole team wins, and a team keeps playing when a member is eliminated.</p></div><div class="acts"><button class="btn alt" data-a="close">Close</button></div>`);}
function menu(){openOv(`<h2>Menu</h2><p>Animation speed</p><div class="acts" style="justify-content:flex-start">${[['Relaxed',1.4],['Normal',1],['Fast',.45]].map(([n,v])=>`<button class="btn ${speed===v?'':'alt'}" data-a="speed" data-v="${v}">${n}</button>`).join('')}</div>
<p>Layout</p><div class="acts" style="justify-content:flex-start"><button class="btn ${$('#app').classList.contains('phone')?'':'alt'}" data-a="phone">Phone view ${$('#app').classList.contains('phone')?'on':'off'}</button><button class="btn alt" data-a="rules">Rules</button></div>

function gameReport(){const L=loadProf().hist||[],h=L[L.length-1];if(!h||Math.abs(h.t-Date.now())>60000||!S||S.online)return '';
  const tiles=[['Rounds',h.rounds],['Length',fmtDur(durOf(h))],['Damage dealt',h.st.dmg],['Counters',h.st.counters],['Ultimates',h.st.ults],['Cards gained',h.st.gains],['Dragons',h.st.dragons],['Healing',h.st.heal]];
  return `<h2 style="font-size:1.1rem;margin-top:10px">Game Report</h2><div class="hstats">${tiles.map(([k,v])=>`<span><b>${v||0}</b>${k}</span>`).join('')}</div>`;}
// ---------- Report a problem ----------
const REPORT_EMAIL='keithburgun@gmail.com';
function reportSheet(){openOv(`<h2>Report a problem</h2><p>What went wrong? A sentence or two is plenty.</p>
  <textarea id="rptxt" class="rptxt" rows="5" placeholder="e.g. Shuriken cancelled the wrong card in round 3"></textarea>
  <label class="longm"><input type="checkbox" id="rpdet" checked> Include game details (version, mode, the last 40 log lines and a snapshot of the game)</label>
  <p class="lbl" id="rpmsg"></p><div class="acts"><button class="btn" data-a="reportsend">Send report</button><button class="btn alt" data-a="close">Cancel</button></div>`);setTimeout(()=>{const x=$('#rptxt');if(x)x.focus();},60);}
function reportText(note,det){const v=(document.getElementById('ver')||{}).textContent||'';let s=`SPELLSTORM PROBLEM REPORT\nWhen: ${new Date().toString()}\nVersion: ${v}\nDevice: ${navigator.userAgent}\nScreen: ${innerWidth}x${innerHeight}\n\nDescription:\n${note||'(none)'}\n\nAnimation health: ${JSON.stringify(animDiag())}`;
  if(det&&S){s+=`\nMode: ${S.ranked?'Ranked':S.online?'Online':S.mode||'Versus'}${S.win?' (Long Match)':''} | Players: ${S.pl.map(P=>WIZ[P.wiz].short+(P.out?' (out)':'')).join(', ')}\nBattle ${S.battle}, round ${S.round}, phase ${S.phase} | Weather: ${S.wcur||'-'}\n`;
    s+=`Status: ${S.pl.map(P=>`${WIZ[P.wiz].short} hp ${P.hp}/${P.max} shards ${P.shards} tier ${P.tier} power ${P.power} mana ${P.mana} hand [${P.hand.map(c=>c.id).join(',')}]`).join(' || ')}\n`;
    s+=`\nLast log lines:\n${logs.slice(-40).map(l=>'  '+l.m).join('\n')}\n`;
    try{s+=`\nSnapshot:\n${JSON.stringify(S).slice(0,60000)}\n`;}catch(e){}}
  return s;}
async function sendReport(){const note=($('#rptxt')||{}).value||'',det=($('#rpdet')||{}).checked,txt=reportText(note.trim(),det),msg=$('#rpmsg');
  if(msg)msg.textContent='Sending…';
  if(window.claude&&claude.use){try{const db=await claude.use('db');if(db){await db.collection('reports').add({text:txt,t:Date.now(),note:note.slice(0,500)});
    openOv(`<h2>Thanks!</h2><p>Your report was saved. It will be collected into the project’s problem-report file.</p><div class="acts"><button class="btn" data-a="close">OK</button></div>`);return;}}catch(e){}}
  try{await navigator.clipboard.writeText(txt);}catch(e){}
  const mail=`mailto:${REPORT_EMAIL}?subject=${encodeURIComponent('Spellstorm problem report')}&body=${encodeURIComponent(txt.slice(0,1800)+(txt.length>1800?'\n\n[Full report copied to the clipboard; paste it here.]':''))}`;
  openOv(`<h2>Send your report by email</h2><p>The full report has been copied to your clipboard. Tap below to open an email to the developer, then paste it in if it’s cut short.</p>
    <div class="acts"><a class="btn" href="${mail}" target="_blank" rel="noopener">Open email</a><button class="btn alt" data-a="close">Done</button></div><p class="lbl">Or email it yourself to ${REPORT_EMAIL}.</p>`);}
function showEnd(r,fresh=[]){
  const w=r.winner,W=WIZ[S.pl[w].wiz],T=TOURRES,why=r.why==='shards'?'by collecting 8 Storm Shards':r.why==='health'?'by bringing their rival to 0 health':'on the tiebreak';
  let head=`<h2 style="font-size:2rem">${S.team?(S.team[w]===S.team[0]?'Your team wins!':(S.mode==='coop'?'Robot Boy wins':'The other team wins')):w===0?'You win!':esc(W.short)+' wins'}</h2>`;
  if(DAILYRES&&S.daily){const X=DAILYRES;head=`<div class="tourhead${X.ok?'':' lose'}"><span class="tourbig">${X.ok?'CHALLENGE COMPLETE':'CHALLENGE FAILED'}</span><span>${esc(S.daily.C.title)}${X.ok?` · 🔥 ${X.streak}-day streak`:''}</span>${X.why?`<span class="lbl">${esc(X.why)}</span>`:''}</div>`;}
  if(RANKRES){const X=RANKRES;head=`<div class="tourhead${X.won?'':' lose'}"><span class="tourbig">${X.won?'VICTORY':'DEFEAT'}</span><span class="elochg">Elo ${X.old} → <b>${X.now}</b> <span class="${X.d>=0?'rup':'rdn'}">(${X.d>=0?'+':''}${X.d})</span></span><span class="lbl">vs ${esc(X.name)} (${X.opp})</span></div>`;}
  if(T){if(T.kind==='win')head=`<div class="tourhead"><span class="tourbig">OPPONENT ${T.n}/7 DEFEATED!</span><span>Next up: <b>${esc(RNAME[T.next])}</b>. Your progress is saved.</span></div>`;
    else if(T.kind==='champ')head=`<div class="tourhead champ">${TROPHY}<span class="tourbig">TOURNAMENT CHAMPION!</span><span>You beat all 7 opponents on ${DNAME[T.diff]}. Your trophy is on the Stats screen.</span></div>`;
    else head=`<div class="tourhead lose"><span class="tourbig">TOURNAMENT OVER</span><span>${esc(WIZ[S.pl[1].wiz].n)} ended your run. You defeated ${T.n} of 7 opponents.</span></div>`;}
  openOv(`${head}<p>${w===0?'You':esc(W.n)} won ${why} after ${S.battle} battle${S.battle>1?'s':''}.</p>
  <p class="lbl" style="text-align:left">Final: you ${S.pl[0].hp} health, ${S.pl[0].shards} shards; ${[...S.pl.keys()].filter(q=>q).map(q=>`${esc(WIZ[S.pl[q].wiz].short)} ${S.pl[q].out?'eliminated':S.pl[q].hp+' health'}, ${S.pl[q].shards} shards`).join('; ')}. ${S.ranked?'Ranked':(S.cheater?'Cheater':DNAME[S.diff])+' difficulty'}${T?', Tournament Mode':''}${S.win?', Long Match':''}${S.ranked?' (Ranked match)':''}.</p>
  ${gameReport()}${fresh.length?`<h2 style="font-size:1.1rem;margin-top:10px">Achievements unlocked</h2><div class="newach">${fresh.map(a=>`<button class="achb" data-a="achinfo" data-n="${esc(a.n)}" data-d="${esc(a.d)}" title="${esc(a.d)}">🏆 ${esc(a.n)}</button>`).join('')}</div><p class="achdesc lbl">Tap an achievement to see what it’s for.</p>`:''}
  ${(()=>{const L=loadProf().hist||[],h=L[L.length-1];return !S.online&&h&&(h.rp||h.rpx)&&Math.abs(h.t-Date.now())<60000?`<div class="acts" style="margin-bottom:-4px">${h.rpx?'<button class="btn alt" data-a="rpplay" data-i="-1">▶ Watch replay</button><button class="btn alt" data-a="rpexport" data-i="-1">Export match</button>':''}${h.rp?'<button class="btn alt" data-a="rpwatch" data-i="-1">Round summary</button>':''}</div>`:'';})()}<div class="acts">${S.online?'<button class="btn" data-a="olexit">Back to title</button><button class="btn alt" data-a="close">View board</button>':RANKRES?'<button class="btn" data-a="rankagain">Play again</button><button class="btn alt" data-a="restart">Ranked lobby</button>':T?'<button class="btn" data-a="restart">Continue</button>':'<button class="btn" data-a="again">Play again</button><button class="btn alt" data-a="restart">Choose wizards</button>'}<button class="btn alt" data-a="totitle">Title screen</button><button class="btn alt" data-a="close">View board</button></div>`);
}

    body=`<div class="achs">${ACH.map(a=>{const on=!!P.ach[a.id];let pr='';if(!on&&a.prog){const [c,m]=a.prog(P);pr=`<small>${Math.min(c,m)} / ${m}</small><div class="bar"><i style="width:${Math.min(100,100*c/m)}%"></i></div>`;}
      return `<div class="ach ${on?'got':'lock'}"><i class="tk ci-tk_shard"></i><div><b>${esc(a.n)}</b><small>${esc(a.d)}</small>${pr}</div></div>`;}).join('')}</div>`;
  }
  openOv(`<h2>Stats</h2>${tabs}${body}<div class="acts"><button class="btn alt" data-a="close">Close</button></div>`);$('#sheet').classList.add('wide');
}
function optionsSheet(confirmReset){
  const seg=(k,vals)=>`<span class="seg">${vals.map(([v,l])=>`<button data-a="opt" data-k="${k}" data-v="${v}" aria-pressed="${String(OPT[k])===String(v)}">${l}</button>`).join('')}</span>`;

  <h3>Progress</h3><button class="btn alt" data-a="report">Report a problem</button> <button class="btn alt" data-a="wipe1">Wipe all data</button>

}
const p0=b=>+b.dataset.p===0?'Your':esc(WIZ[S.pl[1].wiz].short)+'’s';
function showStart(){gameId++;teardown();S=null;setTimeout(()=>{if(!OPT.tutAsked){OPT.tutAsked=true;saveOpt();openOv(`<h2>Welcome to Spellstorm!</h2><p>Do you want to play an interactive tutorial? (You can also read the rules in the menu, or play the tutorial later via the Tutorial button.)</p><div class="acts"><button class="btn" data-a="tutstart">Play the tutorial</button><button class="btn alt" data-a="close">Not now</button></div>`);}},250);document.body.classList.remove('shop');$('#start').style.display='flex';drawSelect();}
let TOURRES=null;
async function begin(w,opp,o={}){
  const id=++gameId;teardown();$('#start').style.display='none';$('#title').style.display='none';logs=[];FX={};pending=null;
  SEEN=new Map();ANIM_ON=false;TRANSIT=new Map();LASTV=[{},{}];LASTSP=null;LASTJ=null;LASTVOID=null;TOURRES=null;TUT.step=null;TUT.res=null;TUT.off=false;TUT.seen={};
  if(o.resume){S=o.resume.S;TR=o.resume.TR;logs=o.resume.logs||[];if(TR&&TR.rpx){TR.rpx.resumed=true;}}
  else if(o.replay){const X=o.replay.h.rpx,tg=o.replay.target||0,sp0=o.replay.speed0!=null?o.replay.speed0:speed;S=JSON.parse(X.s0);S.replay=true;S.tips=false;TR=null;
    RPLAY={d:X.d,i:0,h:o.replay.h,from:o.replay.from,speed0:sp0,turn:0,auto:false,done:false,target:tg>0?tg:null,ff:tg>0,paused:false,hold:!(tg>0),view:o.replay.view||0,exp:o.replay.exp?{snaps:[],log:[]}:null};speed=RPLAY.ff?0.0005:sp0;SFX.mute=RPLAY.ff;seedRandom(X.seed);}
  else{if(o.puzzle){PZEND=false;seedRandom(1000+o.puzzle.id);S=puzzleState(o.puzzle);}else if(o.daily){seedRandom(o.daily.seed);const C=o.daily.C,cpu=dailyCpu(C);S=C.opponent==='robot'?newStateRB(w,cpu.diff||'medium'):newState(w,opp);if(cpu.rank)S.aiProf={1:{rank:cpu.rank,pers:cpu.pers}};applyEdition(S,OPT.ed1?1:2);applyRules(S,C.rules);S.daily=o.daily;unseedRandom();}else if(o.online){S=newState(w,opp);S.online=true;S.diff='normal';}else if(o.ranked){S=newState(w,opp);S.ranked=o.ranked;S.aiProf={1:{rank:o.ranked.rank,pers:o.ranked.pers}};}else S=o.coop?newStateCoop(w,o.coop,o.rb,OPT.diff==='cheater'?'expert':OPT.diff):o.tvt?newState2v2(w,o.tvt[0],o.tvt[1],o.tvt[2],OPT.diff==='cheater'?'expert':OPT.diff):o.rb?newStateRB(w,o.rb):o.multi?newStateN([w,...o.multi]):newState(w,opp);S.diff=o.rb||o.diff||OPT.diff;if(o.tutorial)setupTutorial(S);if(o.ranked||o.puzzle)S.diff='normal';if(S.diff==='cheater'){if(S.pl.length===2&&!o.tour&&!o.daily&&!o.ranked&&!S.rbMode&&!S.pl[1].rb){S.cheater=true;}S.diff='expert';}if(o.daily){const cpu=dailyCpu(o.daily.C);S.diff=cpu.rank?'normal':(cpu.diff||'normal');}if(S.ed==null&&!o.puzzle)applyEdition(S,OPT.ed1?1:2);   // puzzles keep the rules they were built and verified with
  S.tips=!!(OPT.tips&&!o.ranked&&!o.tour&&!o.online&&!o.tutorial&&!o.puzzle);if(OPT.long&&!o.tutorial&&!o.ranked&&!o.daily&&!o.puzzle){S.win=12;for(const P of S.pl){P.max=Math.round(P.max*1.5);P.hp=P.max;}}TR=newTR(w,o.coop?'coop':o.tvt?'2v2':o.multi?'ffa':opp,o.ranked?'ranked':S.cheater?'cheater':S.diff);TR.ranked=!!o.ranked;RANKRES=null;TR.tour=!!o.tour;TR.tutorial=!!o.tutorial;TR.daily=!!o.daily;if(o.online||o.puzzle)TR=null;}
  if(TR&&!o.resume&&!S.online&&!S.tutorial&&!S.puzzle&&!S.replay){const seed=Math.floor(Math.random()*4294967295);seedRandom(seed);TR.rpx={seed,s0:JSON.stringify(S),d:[]};}
  if(!o.resume&&!S.replay&&!S.puzzle&&!S.tutorial&&!S.daily&&!S.online&&S.pl.length===2&&S.pl[1].wiz)noteOpp(S.pl[1].wiz);   // opponent variety
  G=new Game(S,makeIO(id));renderLog();render();if(S.replay)rpBar();
  if(S.win&&!o.resume)setTimeout(()=>{if(id===gameId)makeIO(id).log(`Long Match: every wizard has 50% more health, and ${S.win} Storm Shards win.`,'ini');},0);
  if(o.resume)makeIO(id).log(`Match resumed at battle ${S.battle}, round ${S.round}.`,'head');
  else makeIO(id).log(S.puzzle?`Puzzle ${S.puzzle.id}: ${PUZZLES[S.puzzle.id-1].title}. ${PUZZLE_GOAL_TEXT(S.puzzle.goal)}`:S.daily?`Daily Challenge: ${S.daily.C.title}. ${GOALTXT(S.daily.C.goal)}`:S.online?`Online match: you play ${WIZ[S.pl[0].wiz].n} against ${WIZ[S.pl[1].wiz].n}.`:S.ranked?`Ranked match: you play ${WIZ[S.pl[0].wiz].n} against ${S.ranked.name} (Elo ${S.ranked.elo}), who plays ${WIZ[S.pl[1].wiz].n}.`:S.mode==='coop'?`Co-op: you play ${WIZ[S.pl[0].wiz].n} with ${S.pl.slice(1,-1).map(P=>WIZ[P.wiz].n).join(', ')} against Robot Boy.`:S.mode==='2v2'?`Two-on-Two: you and ${WIZ[S.pl[2].wiz].n} against ${WIZ[S.pl[1].wiz].n} and ${WIZ[S.pl[3].wiz].n}.`:S.pl.length>2?`Free-for-All: you play ${WIZ[S.pl[0].wiz].n} against ${S.pl.slice(1).map(P=>WIZ[P.wiz].n).join(', ')}.`:`You play ${WIZ[S.pl[0].wiz].n}; the CPU plays ${WIZ[S.pl[1].wiz].n}. ${S.init===0?'You have':WIZ[S.pl[1].wiz].short+' has'} the Initiative.`,'head');
  if(o.puzzle)setTimeout(()=>{if(id===gameId)puzzleIntro(o.puzzle);},300);
  try{const r=await (o.resume||o.puzzle?G.resumeRun():G.run());if(id!==gameId)return;if(S.puzzle){puzzleCheck('over');return;}if(S.replay){replayDone(r);return;}clearSave();S.blast=null;S.potion=null;pending=null;TUT.step=null;const fresh=recordGame(r);render();SFX.play(r.winner===0?'win':'lose');await sleep(600);if(id===gameId)showEnd(r,fresh);}
  catch(err){console.error(err);if(id===gameId)openOv(`<h2>Something went wrong</h2><p>${esc(err.message)}</p><div class="acts"><button class="btn" data-a="again">Restart</button></div>`);}
}
function resign(){if(!S||S.over)return;const opp=[...S.pl.keys()].find(q=>q!==0&&!S.pl[q].out&&(!S.team||S.team[q]!==S.team[0]))??1,wasTour=TR&&TR.tour;
  const r={winner:opp,why:'resign'};S.over=r;gameId++;pending=null;recordGame(r);clearSave();closeOv();showTitle();}
function teardown(){unseedRandom();speed=OPT.speed||1;if(RPLAY){speed=RPLAY.speed0;RPLAY=null;}SFX.mute=false;{const rb=document.getElementById('rpbar');if(rb)rb.classList.remove('show');}ACK=null;pending=null;if(typeof TUT!=='undefined'){TUT.step=null;TUT.res=null;}const co=document.getElementById('coach');if(co)co.classList.remove('show');document.querySelectorAll('.tutring').forEach(e=>e.classList.remove('tutring'));thinking=false;sel=[];closeOv();for(const id of ['prompt','cloud','arena','hand','opp','me','blast','potov']){const e=$('#'+id);if(e){e.innerHTML='';e._h=null;}}
  $('#blast').classList.remove('show');$('#potov').classList.remove('show');document.body.classList.remove('shop','ceremony');$('#prompt').classList.remove('ask','waiting');
  document.querySelectorAll('.ghost,.flt').forEach(e=>e.remove());$('#toast').classList.remove('show');$('#nb').classList.remove('go');FX={};FLQ=[];LASTSNAP=[null,null];LASTW=null;LASTINIT=null;}
function showTitle(){setEdClass(OPT.ed1?1:2);gameId++;teardown();S=null;if(ONL.on)onlLeave();{const ob=document.getElementById('onlbtn');if(ob)ob.hidden=onlInApp();}{const sv=loadSave();$('#contbtn').hidden=!sv;$('#playbtn').classList.toggle('primary',!sv);if(sv)$('#contbtn').innerHTML=`Continue match<small>${RNAME[sv.S.pl[0].wiz]} vs ${sv.S.pl.slice(1).map(P=>RNAME[P.wiz]).join(', ')}</small>`;}document.body.classList.remove('shop');$('#start').style.display='none';$('#title').style.display='flex';setTimeout(()=>{const b=$('#title .tbtn');if(b)b.focus();},50);}

{const q=new URLSearchParams(location.search).get('v');setVer(q?'v'+q:APP_VERSION);}
